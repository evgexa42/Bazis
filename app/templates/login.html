{% extends "base.html" %}

{% block title %}Вход в систему{% endblock %}

{% block body_attrs %}data-page="login"{% endblock %}

{% block page_class %}page--narrow{% endblock %}

{% block content %}
  <div class="auth-card card">
    <h1 class="section-title">Вход в панель</h1>
    {% if error %}
    <div class="notice-card notice-card--error">{{ error }}</div>
    {% endif %}
    <form method="POST" class="auth-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label class="field-label" for="username">Имя пользователя</label>
      <input class="input" type="text" id="username" name="username" required autofocus>

      <label class="field-label" for="password">Пароль</label>
      <input class="input" type="password" id="password" name="password" required>

      <button type="submit" class="btn btn--primary auth-submit">Войти</button>
    </form>
  </div>
{% endblock %}
